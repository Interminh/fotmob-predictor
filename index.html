<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC 2026 Predictions — Monte Carlo Model</title>
<meta name="description" content="A Monte Carlo Poisson model's World Cup 2026 Round of 32 predictions, tracked live against real results.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<script src="data.js"></script>
<style>
  :root {
    --bg:        #11161a;
    --card:      #1d2229;
    --card-2:    #262c34;
    --border:    #2e353e;
    --text:      #ffffff;
    --text-2:    #9fa7b0;
    --green:     #32c771;
    --green-dim: rgba(50, 199, 113, 0.15);
    --amber:     #e8b64c;
    --amber-dim: rgba(232, 182, 76, 0.15);
    --red:       #e55e5e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    font-size: 15px;
  }

  .page { max-width: 640px; margin: 0 auto; padding: 0 0.75rem 3rem; }

  /* ---------- Top bar ---------- */
  .topbar {
    background: var(--green);
    color: #0b2417;
    margin: 0 -0.75rem 1rem;
    padding: 1rem 1.25rem;
  }
  .topbar h1 { margin: 0; font-size: 1.15rem; font-weight: 800; }
  .topbar p  { margin: 0.15rem 0 0; font-size: 0.8rem; font-weight: 600; opacity: 0.8; }

  /* ---------- Stat tiles ---------- */
  .stat-tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .stat-tile {
    background: var(--card);
    border-radius: 12px;
    padding: 0.8rem 0.5rem;
    text-align: center;
  }
  .stat-tile .value { font-size: 1.4rem; font-weight: 800; color: var(--green); }
  .stat-tile .caption { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2); margin-top: 0.15rem; }

  .progress-note { text-align: center; font-size: 0.78rem; color: var(--text-2); margin: 0 0 1.25rem; }

  /* ---------- Section headers ---------- */
  h2.section {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-2);
    margin: 1.5rem 0 0.5rem;
    padding-left: 0.25rem;
  }

  /* ---------- Leaderboard ---------- */
  .leaderboard { background: var(--card); border-radius: 12px; overflow: hidden; }
  .lb-row {
    display: grid;
    grid-template-columns: 1.5rem 1fr 3rem 3rem 3rem;
    gap: 0.5rem;
    align-items: center;
    padding: 0.7rem 0.9rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.head { color: var(--text-2); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .lb-row.me { background: var(--green-dim); }
  .lb-row .rank { color: var(--text-2); font-weight: 600; }
  .lb-row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .lb-row .pts { font-weight: 800; color: var(--green); }

  /* ---------- Match cards ---------- */
  .day-header {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-2);
    margin: 1.1rem 0 0.4rem;
    padding-left: 0.25rem;
  }

  .match {
    background: var(--card);
    border-radius: 12px;
    padding: 0.9rem 0.9rem 0.75rem;
    margin-bottom: 0.5rem;
  }

  .match-main {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.5rem;
  }
  .team { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.9rem; min-width: 0; }
  .team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team.home { justify-content: flex-end; text-align: right; }
  .team img { width: 22px; height: auto; border-radius: 3px; flex-shrink: 0; }
  .team.home img { order: 2; }

  .score-box {
    background: var(--card-2);
    border-radius: 8px;
    padding: 0.35rem 0.7rem;
    font-size: 1.15rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: center;
    min-width: 3.4rem;
  }
  .score-box.pending { color: var(--text-2); font-size: 0.75rem; font-weight: 600; padding: 0.55rem 0.7rem; }

  .match-sub {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.6rem;
    flex-wrap: wrap;
  }
  .pred-chip {
    font-size: 0.75rem;
    color: var(--text-2);
    background: var(--card-2);
    border-radius: 999px;
    padding: 0.25rem 0.7rem;
    font-weight: 600;
  }
  .pred-chip b { color: var(--text); }

  .pill {
    font-size: 0.7rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 0.25rem 0.6rem;
    white-space: nowrap;
  }
  .pill.exact   { background: var(--green-dim); color: var(--green); }
  .pill.partial { background: var(--amber-dim); color: var(--amber); }
  .pill.miss    { background: var(--card-2); color: var(--text-2); }
  .pill.today   { background: var(--green-dim); color: var(--green); }
  .pill.soon    { background: var(--card-2); color: var(--text-2); }

  /* 1X2 probability bar */
  .bar-1x2 { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 0.65rem; }
  .bar-1x2 .h { background: var(--green); }
  .bar-1x2 .d { background: #4a525c; }
  .bar-1x2 .a { background: #7d8794; }
  .bar-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--text-2);
    margin-top: 0.3rem;
    font-variant-numeric: tabular-nums;
  }

  .match-note { font-size: 0.72rem; color: var(--text-2); margin: 0.55rem 0 0; }

  footer { text-align: center; font-size: 0.72rem; color: var(--text-2); margin-top: 2rem; }

  @media (max-width: 420px) {
    .team span { font-size: 0.8rem; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <h1>⚽ Predictor — World Cup 2026</h1>
    <p>Round of 32 · Monte Carlo Poisson model</p>
  </div>

  <div class="stat-tiles">
    <div class="stat-tile"><div class="value" id="stat-points">—</div><div class="caption">Points</div></div>
    <div class="stat-tile"><div class="value" id="stat-outcomes">—</div><div class="caption">Outcomes</div></div>
    <div class="stat-tile"><div class="value" id="stat-exact">—</div><div class="caption">Exact</div></div>
  </div>
  <p class="progress-note" id="hero-progress"></p>

  <h2 class="section">Leaderboard</h2>
  <div class="leaderboard" id="leaderboard">
    <div class="lb-row head"><span></span><span class="name">Model</span><span class="num">Pts</span><span class="num">Out</span><span class="num">Ex</span></div>
  </div>

  <h2 class="section">Matches</h2>
  <div id="matches"></div>

  <footer id="page-footer"></footer>
</div>

<script>
(function () {
  var DATA = window.MATCH_DATA;
  var RULES = DATA.meta.scoring_rules;
  var today = new Date().toISOString().slice(0, 10);

  var FLAG_MAP = {
    CAN: 'ca', RSA: 'za', BRA: 'br', JPN: 'jp', GER: 'de', PRY: 'py',
    NED: 'nl', MAR: 'ma', CIV: 'ci', NOR: 'no', FRA: 'fr', SWE: 'se',
    MEX: 'mx', ECU: 'ec', ENG: 'gb-eng', COD: 'cd', BEL: 'be', SEN: 'sn',
    USA: 'us', BIH: 'ba', ESP: 'es', AUT: 'at', POR: 'pt', CRO: 'hr',
    SUI: 'ch', ALG: 'dz', COL: 'co', GHA: 'gh', AUS: 'au', EGY: 'eg',
    ARG: 'ar', CPV: 'cv'
  };
  function flagUrl(code) {
    var iso2 = FLAG_MAP[code] || code.toLowerCase().slice(0, 2);
    return 'https://flagcdn.com/w40/' + iso2 + '.png';
  }

  function calcPoints(predicted, actual) {
    if (!actual || !predicted) return null;
    var p = predicted.split('-').map(Number);
    var a = actual.split('-').map(Number);
    if (p[0] === a[0] && p[1] === a[1]) return RULES.exact;
    if (Math.sign(p[0] - p[1]) === Math.sign(a[0] - a[1])) return RULES.outcome;
    return 0;
  }

  DATA.matches.forEach(function (m) {
    m.isToday = m.date === today;
    if (m.points_earned === null && m.actual_score) {
      m.points_earned = calcPoints(m.predicted_score, m.actual_score);
    }
  });

  // ---- Header stats ----
  var completed = DATA.matches.filter(function (m) { return m.status === 'completed'; });
  var totalPoints = completed.reduce(function (s, m) { return s + (m.points_earned || 0); }, 0);
  var correctOutcomes = completed.filter(function (m) { return (m.points_earned || 0) >= RULES.outcome; }).length;
  var exactScores = completed.filter(function (m) { return m.points_earned === RULES.exact; }).length;

  document.getElementById('stat-points').textContent = totalPoints;
  document.getElementById('stat-outcomes').textContent = correctOutcomes + '/' + completed.length;
  document.getElementById('stat-exact').textContent = exactScores + '/' + completed.length;
  document.getElementById('hero-progress').textContent =
    completed.length + ' of ' + DATA.matches.length + ' matches complete';

  // ---- Leaderboard ----
  var rows = [{
    name: 'Monte Carlo model',
    points_scored: totalPoints,
    correct_outcomes: correctOutcomes,
    exact_scores: exactScores,
    isModel: true
  }].concat(DATA.comparison_models);

  rows.sort(function (a, b) { return (b.points_scored || 0) - (a.points_scored || 0); });

  function dash(v) { return (v === null || v === undefined) ? '—' : v; }

  var lb = document.getElementById('leaderboard');
  rows.forEach(function (r, i) {
    var div = document.createElement('div');
    div.className = 'lb-row' + (r.isModel ? ' me' : '');
    div.innerHTML =
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="name">' + r.name + '</span>' +
      '<span class="num pts">' + dash(r.points_scored) + '</span>' +
      '<span class="num">' + dash(r.correct_outcomes) + '</span>' +
      '<span class="num">' + dash(r.exact_scores) + '</span>';
    lb.appendChild(div);
  });

  // ---- Match cards ----
  function resultPill(m) {
    if (m.status !== 'completed') {
      return m.isToday ? '<span class="pill today">Today</span>' : '<span class="pill soon">' + m.date.slice(5).replace('-', '/') + '</span>';
    }
    if (m.points_earned === RULES.exact) return '<span class="pill exact">+' + m.points_earned + ' Exact</span>';
    if (m.points_earned >= RULES.outcome) return '<span class="pill partial">+' + m.points_earned + ' Outcome</span>';
    return '<span class="pill miss">0 pts</span>';
  }

  function renderMatch(m) {
    var op = m.outcome_probs;
    var scoreBox = m.actual_score
      ? '<div class="score-box">' + m.actual_score.replace('-', ' - ') + '</div>'
      : '<div class="score-box pending">vs</div>';
    return (
      '<div class="match">' +
        '<div class="match-main">' +
          '<div class="team home"><img src="' + flagUrl(m.home_code) + '" alt=""><span>' + m.home + '</span></div>' +
          scoreBox +
          '<div class="team away"><img src="' + flagUrl(m.away_code) + '" alt=""><span>' + m.away + '</span></div>' +
        '</div>' +
        '<div class="match-sub">' +
          '<span class="pred-chip">Prediction <b>' + m.predicted_score.replace('-', ' - ') + '</b></span>' +
          resultPill(m) +
        '</div>' +
        '<div class="bar-1x2">' +
          '<span class="h" style="width:' + (op.home * 100) + '%"></span>' +
          '<span class="d" style="width:' + (op.draw * 100) + '%"></span>' +
          '<span class="a" style="width:' + (op.away * 100) + '%"></span>' +
        '</div>' +
        '<div class="bar-labels">' +
          '<span>1 &nbsp;' + Math.round(op.home * 100) + '%</span>' +
          '<span>X &nbsp;' + Math.round(op.draw * 100) + '%</span>' +
          '<span>2 &nbsp;' + Math.round(op.away * 100) + '%</span>' +
        '</div>' +
        (m.note ? '<p class="match-note">' + m.note + '</p>' : '') +
      '</div>'
    );
  }

  // Group by date: today first, then upcoming (chronological), then completed (newest first)
  var sorted = DATA.matches.slice().sort(function (a, b) {
    function rank(m) { return m.isToday ? 0 : (m.status === 'completed' ? 2 : 1); }
    if (rank(a) !== rank(b)) return rank(a) - rank(b);
    if (rank(a) === 2) return b.date.localeCompare(a.date);
    return a.date.localeCompare(b.date);
  });

  var html = '';
  var lastGroup = null;
  sorted.forEach(function (m) {
    var group = m.isToday ? 'Today' : (m.status === 'completed' ? 'Finished · ' + m.date : m.date);
    if (group !== lastGroup) {
      html += '<div class="day-header">' + group + '</div>';
      lastGroup = group;
    }
    html += renderMatch(m);
  });
  document.getElementById('matches').innerHTML = html;

  document.getElementById('page-footer').textContent =
    DATA.meta.model_name + ' · Last updated ' + DATA.meta.last_updated;
})();
</script>
</body>
</html>
